{% extends 'base.html' %}

{% block title %}登录 · 设备报修管理系统{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h5 mb-1">登录</h1>
        <p class="text-muted small mb-4">请使用管理员分配的账号登录</p>

        {% if form.non_field_errors %}
          <div class="alert alert-danger py-2 small">{{ form.non_field_errors|join:"；" }}</div>
        {% endif %}

        <form method="post" novalidate>
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label" for="{{ form.username.id_for_label }}">用户名</label>
            <input type="text" name="{{ form.username.name }}" class="form-control"
                   id="{{ form.username.id_for_label }}" autofocus required>
          </div>
          <div class="mb-4">
            <label class="form-label" for="{{ form.password.id_for_label }}">密码</label>
            <input type="password" name="{{ form.password.name }}" class="form-control"
                   id="{{ form.password.id_for_label }}" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">登录</button>
          {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
        </form>
      </div>
    </div>
    <p class="text-center text-muted small mt-3">还没有账号？请联系管理员在后台创建</p>
  </div>
</div>
{% endblock %}
