[project]
name = "enterprise-kb-agent"
version = "0.1.0"
description = "企业知识库智能助手：Agentic RAG 全链路实践项目"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.0",
    "langchain>=1.0.0",
    "langchain-openai>=0.2.0",
    "langchain-text-splitters>=0.3.0",
    "chromadb>=0.5.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain-tavily>=0.1.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "streamlit>=1.38.0",
    "requests>=2.32.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
